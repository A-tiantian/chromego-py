name: Auto Extract

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  Extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 插入这一步，确保脚本运行前数据库已就绪
      - name: Download GeoLite2 Database
        run: wget -O GeoLite2-City.mmdb https://github.com/P3TERX/GeoLite2/raw/download/GeoLite2-City.mmdb

      - name: Run extract script
        run: python main.py

      - name: Write time into README file
        run: |
          echo "DATE=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          sed -Ei "s|最近提取于：\`UTC [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\`|最近提取于：\`UTC $(date '+%Y-%m-%d %H:%M:%S')\`|g" README.md
          sed -Ei "s|recently extracted at: \`UTC [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\`|recently extracted at: \`UTC $(date '+%Y-%m-%d %H:%M:%S')\`|g" README.md
        
      - name: Commit & Push changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: stefanzweifel/git-auto-commit-action@v4.16.0
        with:
          commit_message: Auto extract by Github Actions at UTC ${{ env.DATE }}
          create_branch: true
          branch: main
          commit_options: '--allow-empty'
          push_options: '--force'